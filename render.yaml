services:
  - type: web
    name: 404-coffee-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-404-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
        secret: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
        secret: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000

databases:
  - name: coffee-404-db
    plan: free
    databaseName: coffee_404
    ipAllowList: []
